<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据归档调度系统</title><style>body{font:14px system-ui;margin:0;background:#f4f6f8;color:#18212b}header{background:#172b4d;color:white;padding:18px 28px}main{max-width:1100px;margin:24px auto;padding:0 18px}.stats{display:flex;gap:12px;flex-wrap:wrap}.card{background:white;border:1px solid #dce2e8;border-radius:6px;padding:16px;min-width:180px}table{width:100%;background:white;border-collapse:collapse;margin-top:18px}td,th{padding:10px;border-bottom:1px solid #e6e9ed;text-align:left}button{padding:8px 12px;border:0;background:#1769aa;color:#fff;border-radius:4px;cursor:pointer}.muted{color:#697586}</style></head><body><header><strong>数据归档调度系统</strong><span id="health" style="float:right">检查中...</span></header><main><div class="stats"><div class="card"><b>规则</b><h2 id="rules">-</h2></div><div class="card"><b>任务</b><h2 id="jobs">-</h2></div><div class="card"><b>归档批次</b><h2 id="batches">-</h2></div></div><h2>最近任务</h2><table><thead><tr><th>ID</th><th>类型</th><th>状态</th><th>文件数</th><th>创建时间</th></tr></thead><tbody id="jobRows"></tbody></table></main><script>async function load(){let [r,j,b]=await Promise.all([fetch('/api/v1/rules').then(x=>x.json()),fetch('/api/v1/jobs').then(x=>x.json()),fetch('/api/v1/batches').then(x=>x.json())]);rules.textContent=(r||[]).length;jobs.textContent=(j||[]).length;batches.textContent=(b||[]).length;jobRows.innerHTML=(j||[]).slice(-20).reverse().map(x=>`<tr><td>${x.id}</td><td>${x.type}</td><td>${x.status}</td><td>${x.files||0}</td><td>${x.created_at||''}</td></tr>`).join('');health.textContent='服务正常'}load();setInterval(load,3000)</script></body></html>
